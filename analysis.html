<title>Foot Tap Latency Bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column instrument panel. Setup -> session -> results, one at a time. */
:root{
  --bg:#f7f7f5; --surface:#ffffff; --surface-2:#f1f1ee; --line:#dcdcd6;
  --ink:#16181c; --ink-2:#5a5e66; --ink-3:#8b8f98;
  --accent:#2a78d6; --accent-soft:#e6effb;
  --s1:#2a78d6; --s2:#eb6834; --good:#1baf7a; --warn:#eda100; --bad:#e34948;
  --font-ui:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#14151a; --surface:#1c1e24; --surface-2:#23262d; --line:#32363f;
  --ink:#f2f3f5; --ink-2:#a8adb8; --ink-3:#71767f;
  --accent:#3987e5; --accent-soft:#1b2b42;
  --s1:#3987e5; --s2:#d95926; --good:#199e70; --warn:#c98500; --bad:#e66767;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14151a; --surface:#1c1e24; --surface-2:#23262d; --line:#32363f;
  --ink:#f2f3f5; --ink-2:#a8adb8; --ink-3:#71767f;
  --accent:#3987e5; --accent-soft:#1b2b42;
  --s1:#3987e5; --s2:#d95926; --good:#199e70; --warn:#c98500; --bad:#e66767;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-ui); font-size:15px; line-height:1.55;
  padding-inline:16px; padding-block:28px 56px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* --- header --- */
.masthead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;
  border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.09em}

/* --- panels --- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;display:flex;flex-direction:column;gap:16px}
.panel h2{font-size:12px;font-family:var(--font-mono);font-weight:600;margin:0;
  text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.panel h3{font-size:15px;font-weight:600;margin:0}
p{margin:0;color:var(--ink-2)}
p.lede{color:var(--ink)}

/* --- form grid --- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
label{display:flex;flex-direction:column;gap:5px;min-width:0}
.lbl{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-3)}
input,select{font-family:var(--font-mono);font-size:14px;padding:8px 10px;
  background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
  border-radius:4px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}

/* --- buttons --- */
button{font-family:var(--font-ui);font-size:14px;font-weight:500;cursor:pointer;
  padding:9px 16px;border-radius:4px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* --- session stage --- */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;
  text-align:center;min-height:340px;justify-content:center}
.cond{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}
.count{font-family:var(--font-mono);font-size:56px;font-weight:600;line-height:1;
  font-variant-numeric:tabular-nums}

/* beat dot */
.beat{width:104px;height:104px;border-radius:50%;background:var(--surface-2);
  border:2px solid var(--line);transition:background .06s linear,border-color .06s linear}
.beat.on{background:var(--accent-soft);border-color:var(--accent)}

/* tap pad */
.pad{width:100%;max-width:380px;padding:26px 16px;border-radius:var(--r);
  border:2px dashed var(--line);background:var(--surface-2);color:var(--ink-2);
  font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;user-select:none;touch-action:manipulation}
.pad.hit{border-style:solid;border-color:var(--accent);background:var(--accent-soft);
  color:var(--accent)}

.meter{width:100%;max-width:380px;height:5px;background:var(--surface-2);
  border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent)}

/* --- scale question --- */
.scale{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.scale button{font-family:var(--font-mono);min-width:42px;padding:10px 0}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.anchors{display:flex;justify-content:space-between;width:100%;max-width:380px;
  font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.07em}

/* --- stats --- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile{background:var(--surface);padding:13px 14px;display:flex;flex-direction:column;gap:3px}
.tile .k{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-3)}
.tile .v{font-family:var(--font-mono);font-size:21px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .u{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3)}

/* --- charts --- */
figure{margin:0;display:flex;flex-direction:column;gap:9px}
figcaption{font-size:13px;color:var(--ink-2)}
figcaption b{color:var(--ink);font-weight:600}
svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--font-mono);
  font-size:11px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:2px;flex:none}

/* --- table --- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-family:var(--font-mono);font-size:12.5px}
th,td{padding:8px 11px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--surface-2);font-weight:600;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
tbody tr:last-child td{border-bottom:none}
td{font-variant-numeric:tabular-nums;color:var(--ink)}

textarea{width:100%;height:120px;font-family:var(--font-mono);font-size:11px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);
  border-radius:4px;padding:10px;resize:vertical}

.note{font-size:13px;color:var(--ink-3);border-left:2px solid var(--line);padding-left:12px}
.toast{font-family:var(--font-mono);font-size:11.5px;color:var(--good)}
ul{margin:0;padding-left:18px;color:var(--ink-2);display:flex;flex-direction:column;gap:5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">

  <div class="masthead">
    <h1>Foot Tap Latency Bench</h1>
    <span class="sub">CSCI-7420 &middot; alpha</span>
  </div>

  <!-- ============ SETUP ============ -->
  <section class="panel" id="setup">
    <h2>Session setup</h2>
    <p class="lede">Tap in time with the metronome. Each block adds a different hidden delay between your tap and the system's response. The metronome itself is never delayed.</p>
    <div class="grid">
      <label><span class="lbl">Participant ID</span><input id="pid" value="P01"></label>
      <label><span class="lbl">Tempo (BPM)</span><input id="bpm" type="number" value="100" min="40" max="180"></label>
      <label><span class="lbl">Scored taps / block</span><input id="ntaps" type="number" value="60" min="8" max="200"></label>
      <label><span class="lbl">Hit window (ms)</span><input id="win" type="number" value="100" min="20" max="300"></label>
      <label><span class="lbl">Tap feedback</span>
        <select id="fb"><option value="plain">Plain (no timing shown)</option><option value="timed">Shows early / late</option></select>
      </label>
      <label><span class="lbl">Input</span>
        <select id="inp"><option value="any">Spacebar or tap pad</option><option value="key">Spacebar only</option></select>
      </label>
    </div>
    <div class="note" id="latreport">Audio output latency: measured when the session starts.</div>
    <div class="row">
      <button class="primary" id="go">Start session</button>
      <button id="skipprac">Skip practice</button>
      <label style="flex-direction:row;align-items:center;gap:8px">
        <span class="lbl" style="font-size:10.5px">Load session or Quest CSV</span>
        <input type="file" id="load" accept=".json,.csv,application/json,text/csv" style="width:auto;font-size:11px;padding:5px">
      </label>
    </div>
  </section>

  <!-- ============ SESSION ============ -->
  <section class="stage" id="stage" hidden></section>

  <!-- ============ RESULTS ============ -->
  <section id="results" hidden style="display:flex;flex-direction:column;gap:22px"></section>

</div>

<script>
(function(){
"use strict";

// ---------- condition set (from the proposal) ----------
var CONDITIONS = [0, 50, 100, 200, 400];
var LEADIN = 4;          // unscored beats so the participant can lock on
var PRACTICE_TAPS = 16;

// 5x5 cyclic Latin square. Balanced for position, not for carryover.
// A Williams design would be the beta improvement; noted as a known limitation.
function latinRow(p){
  var n = CONDITIONS.length, out = [];
  for (var i=0;i<n;i++) out.push(CONDITIONS[(i+p) % n]);
  return out;
}

// ---------- state ----------
var S = {
  pid:"P01", bpm:100, ioi:600, nTaps:60, hitWin:100,
  feedback:"plain", input:"any",
  order:[], blockIdx:-1, practice:false,
  blocks:[],            // finished block records
  outputLatencyMs:0,
  ctx:null, running:false
};

var el = {
  setup:  document.getElementById('setup'),
  stage:  document.getElementById('stage'),
  results:document.getElementById('results'),
  latrep: document.getElementById('latreport')
};

function $(id){ return document.getElementById(id); }
function show(node, on){ node.hidden = !on; }

// ---------- audio ----------
function ensureCtx(){
  if (!S.ctx){
    var AC = window.AudioContext || window.webkitAudioContext;
    S.ctx = new AC();
  }
  if (S.ctx.state === "suspended") S.ctx.resume();
  return S.ctx;
}
// Output latency: the gap between the audio clock and the speaker. Constant offsets
// largely cancel within-subject, but it is reported so the number is on the record.
function measureOutputLatency(){
  var c = S.ctx;
  var v = (typeof c.outputLatency === "number" && c.outputLatency > 0) ? c.outputLatency
        : (typeof c.baseLatency  === "number" ? c.baseLatency : 0);
  S.outputLatencyMs = v * 1000;
  return S.outputLatencyMs;
}
function click(when, freq, gain){
  var c = S.ctx;
  var o = c.createOscillator(), g = c.createGain();
  o.type = "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(gain, when + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, when + 0.045);
  o.connect(g); g.connect(c.destination);
  o.start(when); o.stop(when + 0.06);
}

// Map audio-context time to the performance timeline, sampled once per block.
function makeClockMap(){
  var c = S.ctx, ts = null;
  if (typeof c.getOutputTimestamp === "function"){
    try { ts = c.getOutputTimestamp(); } catch(e){ ts = null; }
  }
  if (ts && typeof ts.contextTime === "number" && typeof ts.performanceTime === "number"
      && ts.contextTime > 0){
    var cT = ts.contextTime, pT = ts.performanceTime;
    return function(audioTime){ return pT + (audioTime - cT) * 1000; };
  }
  var cNow = c.currentTime, pNow = performance.now();
  return function(audioTime){ return pNow + (audioTime - cNow) * 1000; };
}

// ---------- stats ----------
function mean(a){ var s=0,i; for(i=0;i<a.length;i++) s+=a[i]; return a.length? s/a.length : NaN; }
function sd(a){
  if (a.length < 2) return NaN;
  var m = mean(a), s = 0, i;
  for (i=0;i<a.length;i++) s += (a[i]-m)*(a[i]-m);
  return Math.sqrt(s/(a.length-1));
}
function blockStats(rec){
  var asy = rec.taps.map(function(t){ return t.asynchrony; });
  var hitBeats = 0, i;
  for (i=0;i<rec.scoredBeats.length;i++){
    var b = rec.scoredBeats[i], got = false, j;
    for (j=0;j<rec.taps.length;j++){
      if (Math.abs(rec.taps[j].tapTime - b) <= S.hitWin){ got = true; break; }
    }
    if (got) hitBeats++;
  }
  return {
    n: asy.length,
    meanAsync: mean(asy),
    sdAsync: sd(asy),
    hitRate: rec.scoredBeats.length ? hitBeats / rec.scoredBeats.length : NaN
  };
}

// ---------- session flow ----------
function startSession(){
  S.pid    = $('pid').value.trim() || "P01";
  S.bpm    = Math.min(180, Math.max(40, parseInt($('bpm').value,10)   || 100));
  S.nTaps  = Math.min(200, Math.max(8,  parseInt($('ntaps').value,10) || 60));
  S.hitWin = Math.min(300, Math.max(20, parseInt($('win').value,10)   || 100));
  S.feedback = $('fb').value;
  S.input    = $('inp').value;
  S.ioi    = 60000 / S.bpm;

  var pnum = parseInt(String(S.pid).replace(/\D/g,""),10);
  if (isNaN(pnum)) pnum = 0;
  S.order = latinRow(pnum % CONDITIONS.length);
  S.blocks = []; S.blockIdx = -1;

  ensureCtx();
  var lat = measureOutputLatency();
  el.latrep.textContent = "Audio output latency: " + lat.toFixed(1) +
    " ms (measured). Beat times are corrected by this amount.";

  show(el.setup, false); show(el.results, false); show(el.stage, true);
  if (S.skipPractice) nextBlock(); else runPractice();
}

function runPractice(){
  S.practice = true;
  el.stage.innerHTML =
    '<div class="cond">Practice &middot; not recorded</div>' +
    '<h3>Tap along with the beat</h3>' +
    '<p>Get used to the rhythm. ' + PRACTICE_TAPS + ' beats, then the session starts.</p>' +
    '<div class="beat" id="dot"></div>' +
    '<div class="pad" id="pad">Spacebar or tap here</div>' +
    '<div class="meter"><i id="bar"></i></div>';
  runBlock(0, PRACTICE_TAPS, true);
}

function nextBlock(){
  S.blockIdx++;
  if (S.blockIdx >= S.order.length){ finish(); return; }
  readyScreen();
}

function readyScreen(){
  var n = S.blockIdx + 1;
  el.stage.innerHTML =
    '<div class="cond">Block ' + n + ' of ' + S.order.length + '</div>' +
    '<h3>Tap on every beat</h3>' +
    '<p>About ' + Math.round((S.nTaps + LEADIN) * S.ioi / 1000) + ' seconds. ' +
      'Four beats lead in before scoring starts.</p>' +
    '<button class="primary" id="rdy">Ready</button>';
  $('rdy').onclick = countdown;
}

function countdown(){
  var k = 3;
  el.stage.innerHTML =
    '<div class="cond">Block ' + (S.blockIdx+1) + ' of ' + S.order.length + '</div>' +
    '<div class="count" id="cd">3</div>';
  ensureCtx();
  var iv = setInterval(function(){
    k--;
    if (k > 0){ $('cd').textContent = String(k); }
    else { clearInterval(iv); blockScreen(); }
  }, 800);
}

function blockScreen(){
  S.practice = false;
  el.stage.innerHTML =
    '<div class="cond">Block ' + (S.blockIdx+1) + ' of ' + S.order.length + '</div>' +
    '<div class="beat" id="dot"></div>' +
    '<div class="pad" id="pad">' +
      (S.input === "key" ? "Press spacebar on each beat" : "Spacebar or tap here") + '</div>' +
    '<div class="meter"><i id="bar"></i></div>' +
    '<div class="cond" id="tally">0 / ' + S.nTaps + '</div>';
  runBlock(S.order[S.blockIdx], S.nTaps, false);
}

// The core loop. Beats are scheduled on the audio clock; taps are timestamped on the
// performance clock; the two are related once per block by makeClockMap().
function runBlock(latencyMs, nScored, isPractice){
  var c = ensureCtx();
  var audioToPerf = makeClockMap();
  var t0 = c.currentTime + 0.6;
  var total = nScored + LEADIN;

  var beatPerf = [];        // heard time of every beat, performance clock
  for (var i=0;i<total;i++){
    var at = t0 + i * (S.ioi/1000);
    click(at, i < LEADIN ? 1320 : 880, i < LEADIN ? 0.08 : 0.16);
    beatPerf.push(audioToPerf(at) + S.outputLatencyMs);
  }
  var scoredBeats = beatPerf.slice(LEADIN);

  var dot = $('dot'), pad = $('pad'), bar = $('bar'), tally = $('tally');
  var taps = [], done = false, nextFlash = 0;

  // visual beat indicator, driven off the same schedule
  var raf = function(){
    if (done) return;
    var now = performance.now();
    while (nextFlash < beatPerf.length && now >= beatPerf[nextFlash] - 8){
      if (dot){
        dot.classList.add('on');
        setTimeout(function(){ if(dot) dot.classList.remove('on'); }, 70);
      }
      nextFlash++;
    }
    if (bar) bar.style.width = Math.min(100, (nextFlash/total)*100) + "%";
    requestAnimationFrame(raf);
  };
  requestAnimationFrame(raf);

  function registerTap(tPerf){
    if (done) return;
    // nearest beat among the scored ones
    var best = -1, bestD = Infinity, k;
    for (k=0;k<scoredBeats.length;k++){
      var d = Math.abs(tPerf - scoredBeats[k]);
      if (d < bestD){ bestD = d; best = k; }
    }
    if (best < 0) return;
    var asy = tPerf - scoredBeats[best];
    // ignore taps that land outside half an inter-onset interval of any scored beat
    if (Math.abs(asy) > S.ioi/2 + 60) return;

    taps.push({ beat: best, tapTime: tPerf, asynchrony: asy });
    if (tally) tally.textContent = taps.length + " / " + nScored;

    // delayed feedback: audio on the sample-accurate clock, visual on a timer
    var when = c.currentTime + latencyMs/1000;
    click(when, 2200, 0.10);
    setTimeout(function(){
      if (!pad) return;
      pad.classList.add('hit');
      if (S.feedback === "timed" && !isPractice){
        pad.textContent = (asy < 0 ? "early " : "late ") + Math.abs(asy).toFixed(0) + " ms";
      } else if (isPractice){
        pad.textContent = "tap detected";
      }
      setTimeout(function(){
        if (!pad) return;
        pad.classList.remove('hit');
        if (S.feedback === "timed" && !isPractice) return;
        pad.textContent = S.input === "key" ? "Press spacebar on each beat" : "Spacebar or tap here";
      }, 130);
    }, latencyMs);
  }

  function onKey(e){
    if (e.code !== "Space" || e.repeat) return;
    e.preventDefault();
    registerTap(typeof e.timeStamp === "number" && e.timeStamp > 0 ? e.timeStamp : performance.now());
  }
  function onPointer(e){
    if (S.input === "key") return;
    e.preventDefault();
    registerTap(typeof e.timeStamp === "number" && e.timeStamp > 0 ? e.timeStamp : performance.now());
  }
  window.addEventListener('keydown', onKey);
  if (pad) pad.addEventListener('pointerdown', onPointer);

  var endAt = (beatPerf[beatPerf.length-1] - performance.now()) + 700;
  setTimeout(function(){
    done = true;
    window.removeEventListener('keydown', onKey);
    if (pad) pad.removeEventListener('pointerdown', onPointer);
    if (isPractice){ nextBlock(); return; }
    var rec = {
      latency: latencyMs, position: S.blockIdx + 1,
      ioi: S.ioi, taps: taps, scoredBeats: scoredBeats, rating: null
    };
    S.blocks.push(rec);
    askRating(rec);
  }, Math.max(400, endAt));
}

function askRating(rec){
  el.stage.innerHTML =
    '<div class="cond">Block ' + rec.position + ' of ' + S.order.length + ' complete</div>' +
    '<h3>How responsive did that block feel?</h3>' +
    '<div class="scale" id="sc"></div>' +
    '<div class="anchors"><span>1 &middot; sluggish</span><span>instant &middot; 7</span></div>' +
    '<button class="primary" id="cont" disabled>Continue</button>';
  var sc = $('sc'), cont = $('cont'), chosen = null;
  for (var v=1; v<=7; v++){
    (function(val){
      var b = document.createElement('button');
      b.textContent = String(val);
      b.setAttribute('aria-pressed','false');
      b.onclick = function(){
        chosen = val;
        Array.prototype.forEach.call(sc.children, function(x){ x.setAttribute('aria-pressed','false'); });
        b.setAttribute('aria-pressed','true');
        cont.disabled = false;
      };
      sc.appendChild(b);
    })(v);
  }
  cont.onclick = function(){ rec.rating = chosen; nextBlock(); };
}

// ---------- results ----------
function finish(){
  show(el.stage, false);
  show(el.results, true);
  renderResults(buildSession());
  el.results.scrollIntoView({behavior:"smooth", block:"start"});
}

function buildSession(){
  return {
    schema:"foot-tap-latency/alpha-1",
    participant:S.pid,
    recordedAt:new Date().toISOString(),
    bpm:S.bpm, ioi:S.ioi, scoredTapsPerBlock:S.nTaps,
    hitWindowMs:S.hitWin, leadInBeats:LEADIN,
    feedbackMode:S.feedback, inputMode:S.input,
    audioOutputLatencyMs:+S.outputLatencyMs.toFixed(2),
    conditionOrder:S.order,
    blocks:S.blocks.map(function(b){
      var st = blockStats(b);
      return {
        latency:b.latency, position:b.position, rating:b.rating,
        n:st.n,
        meanAsynchronyMs:+st.meanAsync.toFixed(2),
        sdAsynchronyMs:+st.sdAsync.toFixed(2),
        hitRate:+st.hitRate.toFixed(4),
        taps:b.taps.map(function(t){
          return { beat:t.beat, asynchronyMs:+t.asynchrony.toFixed(2) };
        })
      };
    })
  };
}

// --- chart helper: ordinal x, linear y, drawn to scale ---
function lineChart(opts){
  var W=640, H=250, L=56, R=18, T=18, B=44;
  var pw = W-L-R, ph = H-T-B;
  var vals = opts.values;
  var finite = vals.filter(function(v){ return isFinite(v); });
  if (!finite.length) finite = [0,1];
  var lo = opts.min !== undefined ? opts.min : Math.min.apply(null, finite);
  var hi = opts.max !== undefined ? opts.max : Math.max.apply(null, finite);
  if (hi - lo < 1e-6){ hi = lo + 1; }
  var pad = (hi-lo)*0.14; lo -= pad; hi += pad;
  if (opts.min !== undefined) lo = opts.min;
  if (opts.max !== undefined) hi = opts.max;

  var x = function(i){ return L + (vals.length<2 ? pw/2 : (pw * i/(vals.length-1))); };
  var y = function(v){ return T + ph - ((v-lo)/(hi-lo))*ph; };

  var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+opts.aria+'">';
  // y grid + ticks
  var steps = 4, i;
  for (i=0;i<=steps;i++){
    var v = lo + (hi-lo)*i/steps, yy = y(v);
    s += '<line x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+
         '" stroke="var(--line)" stroke-width="1" fill="none"/>';
    s += '<text x="'+(L-9)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" fill="var(--ink-3)" '+
         'font-family="var(--font-mono)" font-size="11">'+opts.fmt(v)+'</text>';
  }
  // x labels
  for (i=0;i<vals.length;i++){
    s += '<text x="'+x(i).toFixed(1)+'" y="'+(H-20)+'" text-anchor="middle" fill="var(--ink-3)" '+
         'font-family="var(--font-mono)" font-size="11">'+opts.labels[i]+'</text>';
  }
  s += '<text x="'+(L+pw/2).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" fill="var(--ink-3)" '+
       'font-family="var(--font-mono)" font-size="10.5" letter-spacing="0.08em">ADDED LATENCY (MS)</text>';
  // zero reference
  if (lo < 0 && hi > 0){
    s += '<line x1="'+L+'" y1="'+y(0).toFixed(1)+'" x2="'+(W-R)+'" y2="'+y(0).toFixed(1)+
         '" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3" fill="none"/>';
  }
  // path
  var d = "", drew = 0;
  for (i=0;i<vals.length;i++){
    if (!isFinite(vals[i])) continue;
    d += (drew===0 ? "M" : "L") + x(i).toFixed(1) + " " + y(vals[i]).toFixed(1) + " ";
    drew++;
  }
  if (drew>1) s += '<path d="'+d.trim()+'" fill="none" stroke="'+opts.color+'" stroke-width="2" '+
                   'stroke-linejoin="round" stroke-linecap="round"/>';
  // markers + direct labels
  for (i=0;i<vals.length;i++){
    if (!isFinite(vals[i])) continue;
    s += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(vals[i]).toFixed(1)+'" r="5" fill="'+opts.color+
         '" stroke="var(--surface)" stroke-width="2"/>';
    var ly = y(vals[i]) - 13;
    if (ly < T+10) ly = y(vals[i]) + 20;
    s += '<text x="'+x(i).toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" fill="var(--ink-2)" '+
         'font-family="var(--font-mono)" font-size="11" font-weight="500">'+opts.fmt(vals[i])+'</text>';
  }
  s += '</svg>';
  return s;
}

function renderResults(sess){
  var byLat = {};
  sess.blocks.forEach(function(b){ byLat[b.latency] = b; });
  var labels = CONDITIONS.map(String);
  var sdv  = CONDITIONS.map(function(L){ return byLat[L] ? byLat[L].sdAsynchronyMs : NaN; });
  var rate = CONDITIONS.map(function(L){ return byLat[L] && byLat[L].rating ? byLat[L].rating : NaN; });
  var mn   = CONDITIONS.map(function(L){ return byLat[L] ? byLat[L].meanAsynchronyMs : NaN; });
  var hr   = CONDITIONS.map(function(L){ return byLat[L] ? byLat[L].hitRate*100 : NaN; });

  var base = byLat[0];
  var worst = sess.blocks.length ? sess.blocks.reduce(function(a,b){
    return (b.sdAsynchronyMs > a.sdAsynchronyMs) ? b : a; }, sess.blocks[0]) : null;
  var delta = (base && worst) ? (worst.sdAsynchronyMs - base.sdAsynchronyMs) : NaN;

  var html = "";

  // headline tiles
  html += '<section class="panel"><h2>Session summary</h2>' +
    '<div class="tiles">' +
      tile("Participant", sess.participant, "") +
      tile("Tempo", sess.bpm, "bpm / " + Math.round(sess.ioi) + " ms IOI") +
      tile("Taps recorded", sess.blocks.reduce(function(s,b){return s+b.n;},0), "across " + sess.blocks.length + " blocks") +
      (sess.audioTimed === null || sess.audioTimed === undefined
        ? tile("Audio out latency", sess.audioOutputLatencyMs.toFixed(1), "ms, corrected")
        : tile("Beat timing", sess.audioTimed ? "sample" : "frame",
               sess.audioTimed ? "pinned to audio" : "quantised, ~14 ms")) +
    '</div>' +
    (sess.audioTimed === false
      ? '<p class="note" style="border-left-color:var(--warn)">This session fell back ' +
        'to a visual beat, so every beat time carries about 14 ms of display-frame ' +
        'quantisation. Treat the curve as indicative and check the audio indicator ' +
        'before the next run.</p>'
      : '') +
    '<p class="note">Order for this participant: ' + sess.conditionOrder.join(" &rarr; ") +
      ' ms. Tap feedback: ' + (sess.feedbackMode === "timed" ? "early/late shown" : "plain") + '.</p>' +
    '</section>';

  // chart 1
  html += '<section class="panel"><h2>RQ1 &middot; Timing precision</h2>' +
    '<figure>' + lineChart({
      values: sdv, labels: labels, color: "var(--s1)",
      aria: "Standard deviation of asynchrony by added latency",
      fmt: function(v){ return v.toFixed(0); }, min: 0
    }) +
    '<figcaption><b>SD of asynchrony (ms).</b> How consistently taps landed relative to the beat. ' +
      'Lower is steadier. The point where this bends upward is the performance threshold.' +
      (isFinite(delta) ? ' Spread grew by <b>' + delta.toFixed(0) + ' ms</b> from 0 ms to ' +
        worst.latency + ' ms.' : '') +
    '</figcaption></figure></section>';

  // chart 2
  html += '<section class="panel"><h2>RQ2 &middot; Perceived responsiveness</h2>' +
    '<figure>' + lineChart({
      values: rate, labels: labels, color: "var(--s2)",
      aria: "Perceived responsiveness rating by added latency",
      fmt: function(v){ return v.toFixed(1); }, min: 1, max: 7
    }) +
    '<figcaption><b>Self-reported responsiveness (1 to 7).</b> Collected immediately after each block. ' +
      'The point where this falls is the perception threshold. The gap between this bend and the one ' +
      'above is RQ3.</figcaption></figure>' +
    '<div class="legend">' +
      '<span><i class="swatch" style="background:var(--s1)"></i>Timing precision</span>' +
      '<span><i class="swatch" style="background:var(--s2)"></i>Perceived responsiveness</span>' +
    '</div></section>';

  // table
  html += '<section class="panel"><h2>Per-block results</h2><div class="tablewrap"><table>' +
    '<thead><tr><th>Added latency</th><th>Order</th><th>Taps</th><th>Mean async</th>' +
    '<th>SD async</th><th>Hit rate</th><th>Rating</th></tr></thead><tbody>';
  CONDITIONS.forEach(function(L){
    var b = byLat[L];
    html += '<tr><td>' + L + ' ms</td>' +
      '<td>' + (b ? b.position : "&mdash;") + '</td>' +
      '<td>' + (b ? b.n : "&mdash;") + '</td>' +
      '<td>' + (b && isFinite(b.meanAsynchronyMs) ? b.meanAsynchronyMs.toFixed(1) : "&mdash;") + '</td>' +
      '<td>' + (b && isFinite(b.sdAsynchronyMs) ? b.sdAsynchronyMs.toFixed(1) : "&mdash;") + '</td>' +
      '<td>' + (b && isFinite(b.hitRate) ? (b.hitRate*100).toFixed(0) + "%" : "&mdash;") + '</td>' +
      '<td>' + (b && b.rating ? b.rating : "&mdash;") + '</td></tr>';
  });
  html += '</tbody></table></div>' +
    '<p class="note">Negative mean asynchrony is expected: people habitually tap slightly ahead of ' +
    'the beat (Repp, 2005). It is a property of human timing, not a bug in the apparatus.</p></section>';

  // export
  html += '<section class="panel"><h2>Data</h2>' +
    '<div class="row"><button class="primary" id="copy">Copy session JSON</button>' +
    '<button id="dl">Download .json</button><button id="csv">Download .csv</button>' +
    '<span class="toast" id="toast"></span></div>' +
    '<textarea id="raw" readonly spellcheck="false"></textarea>' +
    '<p class="note">Every tap is recorded individually, not just the per-block summary, so the ' +
    'analysis can be redone without re-running the session.</p>' +
    '<div class="row"><button id="again">New session</button></div></section>';

  el.results.innerHTML = html;

  var json = JSON.stringify(sess, null, 2);
  $('raw').value = json;

  $('copy').onclick = function(){
    var t = $('toast');
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(json).then(function(){ t.textContent = "Copied."; },
        function(){ $('raw').select(); t.textContent = "Selected. Press Ctrl+C."; });
    } else { $('raw').select(); t.textContent = "Selected. Press Ctrl+C."; }
  };
  $('dl').onclick  = function(){ saveFile(json, "application/json",
    "foottap_" + sess.participant + ".json"); };
  $('csv').onclick = function(){ saveFile(toCSV(sess), "text/csv",
    "foottap_" + sess.participant + ".csv"); };
  $('again').onclick = function(){
    show(el.results, false); show(el.setup, true);
    window.scrollTo({top:0, behavior:"smooth"});
  };
}

function tile(k, v, u){
  return '<div class="tile"><span class="k">'+k+'</span><span class="v">'+v+
         '</span><span class="u">'+u+'</span></div>';
}

function toCSV(sess){
  var rows = ["participant,latency_ms,block_position,beat_index,asynchrony_ms,rating"];
  sess.blocks.forEach(function(b){
    b.taps.forEach(function(t){
      rows.push([sess.participant, b.latency, b.position, t.beat,
                 t.asynchronyMs, (b.rating===null?"":b.rating)].join(","));
    });
  });
  return rows.join("\n");
}

function saveFile(text, mime, name){
  try{
    var blob = new Blob([text], {type:mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    $('toast').textContent = "If nothing saved, use Copy. Downloads work in the local file.";
  } catch(e){
    $('toast').textContent = "Download unavailable here. Use Copy instead.";
  }
}

// ---------- Quest CSV ----------
// The headset app logs raw events and computes nothing, so the matching rule
// lives here and can be changed without re-running a participant.
// Columns: event, xr_time_ns, block, latency_ms, index, source_time_ns
function parseQuestCSV(text){
  var lines = String(text).split(/\r?\n/);
  var participant = "quest", ioiMs = 600, audioTimed = null, clockExact = null;
  var rows = [], i;

  for (i = 0; i < lines.length; i++){
    var ln = lines[i].trim();
    if (!ln) continue;
    if (ln.charAt(0) === "#"){
      var mp = ln.match(/participant=(\S+)/);
      var mi = ln.match(/beat_interval_ms=(\d+)/);
      var ma = ln.match(/audio_timed=(\d)/);
      var mc = ln.match(/clock_exact=(\d)/);
      if (mp) participant = mp[1];
      if (mi) ioiMs = parseInt(mi[1], 10);
      if (ma) audioTimed = (ma[1] === "1");
      if (mc) clockExact = (mc[1] === "1");
      continue;
    }
    if (ln.indexOf("event,") === 0) continue;       // header
    var p = ln.split(",");
    if (p.length < 5) continue;
    rows.push({
      kind: p[0],
      t:    parseFloat(p[1]),
      block:parseInt(p[2], 10),
      lat:  parseInt(p[3], 10),
      idx:  parseInt(p[4], 10)
    });
  }
  if (!rows.length) throw new Error("no rows");

  // group by block
  var byBlock = {};
  rows.forEach(function(r){
    if (!isFinite(r.block) || r.block < 1) return;
    if (!byBlock[r.block]) byBlock[r.block] = { beats:[], taps:[], rating:null, lat:r.lat };
    var b = byBlock[r.block];
    if (r.kind === "beat")   b.beats.push(r.t);
    if (r.kind === "tap")    b.taps.push(r.t);
    if (r.kind === "rating") b.rating = r.idx;
    if (isFinite(r.lat)) b.lat = r.lat;
  });

  var NS = 1e6;   // nanoseconds to milliseconds
  var blocks = Object.keys(byBlock).map(Number).sort(function(a,b){return a-b;})
    .map(function(bn){
      var b = byBlock[bn];
      b.beats.sort(function(x,y){return x-y;});
      b.taps.sort(function(x,y){return x-y;});

      var asy = [], taps = [], k, j;
      for (k = 0; k < b.taps.length; k++){
        var best = -1, bestD = Infinity;
        for (j = 0; j < b.beats.length; j++){
          var d = Math.abs(b.taps[k] - b.beats[j]);
          if (d < bestD){ bestD = d; best = j; }
        }
        if (best < 0) continue;
        var a = (b.taps[k] - b.beats[best]) / NS;
        if (Math.abs(a) > ioiMs/2 + 60) continue;   // not plausibly this beat
        asy.push(a);
        taps.push({ beat: best, asynchronyMs: +a.toFixed(2) });
      }

      var hit = 0;
      for (j = 0; j < b.beats.length; j++){
        for (k = 0; k < b.taps.length; k++){
          if (Math.abs(b.taps[k] - b.beats[j]) / NS <= S.hitWin){ hit++; break; }
        }
      }

      return {
        latency: b.lat, position: bn, rating: b.rating,
        n: asy.length,
        meanAsynchronyMs: +mean(asy).toFixed(2),
        sdAsynchronyMs:   +sd(asy).toFixed(2),
        hitRate: b.beats.length ? +(hit / b.beats.length).toFixed(4) : NaN,
        taps: taps
      };
    });

  return {
    schema:"foot-tap-latency/quest-csv-1",
    participant: participant,
    recordedAt: new Date().toISOString(),
    bpm: Math.round(60000 / ioiMs), ioi: ioiMs,
    scoredTapsPerBlock: blocks.length ? blocks[0].n : 0,
    hitWindowMs: S.hitWin, leadInBeats: 4,
    feedbackMode: "quest", inputMode: "controller",
    audioTimed: audioTimed, clockExact: clockExact,
    audioOutputLatencyMs: 0,
    conditionOrder: blocks.map(function(b){ return b.latency; }),
    blocks: blocks
  };
}

// ---------- load a saved session ----------
$('load').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    var txt = String(r.result), sess = null;
    try{
      sess = (txt.trim().charAt(0) === "{") ? JSON.parse(txt) : parseQuestCSV(txt);
      if (!sess || !sess.blocks || !sess.blocks.length) throw new Error("no blocks");
    } catch(err){
      el.latrep.textContent = "Could not read that file. Expected a session JSON from " +
        "this app, or a taps_*.csv from the Quest build.";
      return;
    }
    S.hitWin = sess.hitWindowMs || 100;
    show(el.setup, false); show(el.stage, false); show(el.results, true);
    renderResults(sess);
  };
  r.readAsText(f);
});

$('go').onclick = function(){ S.skipPractice = false; startSession(); };
$('skipprac').onclick = function(){ S.skipPractice = true; startSession(); };

})();
</script>
