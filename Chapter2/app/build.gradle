plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.vulkanxray'
    compileSdk 35

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        applicationId "com.example.vulkanxray"
        minSdk 32
        targetSdk 35
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
            version "3.30.3"
        }
    }

    ndkVersion '28.2.13676358'
}

// CRITICAL: Remove ALL Java dependencies for pure native app
dependencies {
    // Intentionally empty - NativeActivity doesn't need Java libraries
}